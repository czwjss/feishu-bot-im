<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">飞书机器人 · 主动投递（Delivery）流程</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">模型调用工具 → 按 Session / 别名选机器人 → 校验目标 → 飞书 API → 群或用户</text>

  <!-- 列 1：调用方 -->
  <rect x="24" y="90" width="208" height="112" rx="10" fill="#eef4ff" stroke="#93b4ff"/>
  <text x="40" y="116" font-size="13" font-weight="600" fill="#1f2937">模型工具调用</text>
  <text x="40" y="138" font-size="11" fill="#475569">im_feishu_deliver</text>
  <text x="40" y="156" font-size="11" fill="#475569">im_feishu_return_file</text>
  <text x="40" y="174" font-size="11" fill="#475569">bot：别名 / 机器人名</text>

  <!-- 列 2：RuntimeManager -->
  <rect x="272" y="90" width="208" height="112" rx="10" fill="#f5f7ff" stroke="#a5b4fc"/>
  <text x="288" y="116" font-size="13" font-weight="600" fill="#1f2937">RuntimeManager</text>
  <text x="288" y="138" font-size="11" fill="#475569">按 sessionId 找机器人</text>
  <text x="288" y="156" font-size="11" fill="#475569">否则按 bot 参数匹配</text>
  <text x="288" y="174" font-size="11" fill="#475569">多机器人未指定 → 报错</text>

  <!-- 列 3：BotRuntime -->
  <rect x="520" y="90" width="208" height="112" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="536" y="116" font-size="13" font-weight="600" fill="#1f2937">BotRuntime</text>
  <text x="536" y="138" font-size="11" fill="#475569">deliver：校验 oc_ / ou_</text>
  <text x="536" y="156" font-size="11" fill="#475569">文本截断到 4000 字</text>
  <text x="536" y="174" font-size="11" fill="#475569">回文件：30MB 上限</text>

  <!-- 列 4：FeishuBot -->
  <rect x="768" y="90" width="188" height="112" rx="10" fill="#fffdf5" stroke="#fcd34d"/>
  <text x="784" y="116" font-size="13" font-weight="600" fill="#1f2937">FeishuBot</text>
  <text x="784" y="138" font-size="11" fill="#475569">sendText / toUser</text>
  <text x="784" y="156" font-size="11" fill="#475569">uploadFile / Image</text>
  <text x="784" y="174" font-size="11" fill="#475569">sendFile / sendImage</text>

  <!-- 箭头 -->
  <line x1="232" y1="146" x2="268" y2="146" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="146" x2="516" y2="146" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="728" y1="146" x2="764" y2="146" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 飞书平台 -->
  <rect x="420" y="280" width="400" height="104" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="436" y="306" font-size="13" font-weight="600" fill="#1f2937">飞书开放平台 API</text>
  <text x="436" y="328" font-size="11" fill="#475569">im.v1.message.create（receive_id_type = chat_id | open_id）</text>
  <text x="436" y="346" font-size="11" fill="#475569">文件先传 im.v1.file.create / im.v1.image.create</text>
  <text x="436" y="364" font-size="11" fill="#475569">权限：im:message:send_as_bot · im:resource</text>
  <path d="M 862 202 L 862 244 L 800 244 L 800 276" stroke="#5b6b82" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="870" y="250" font-size="11" fill="#475569">HTTPS</text>

  <!-- 落地 -->
  <rect x="120" y="292" width="250" height="80" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="136" y="318" font-size="13" font-weight="600" fill="#1f2937">投递落地</text>
  <text x="136" y="340" font-size="11" fill="#475569">群（chat_id）→ 群里所有成员</text>
  <text x="136" y="358" font-size="11" fill="#475569">用户（open_id）→ 与该用户的单聊</text>
  <line x1="416" y1="332" x2="374" y2="332" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 约束与返回 -->
  <rect x="24" y="420" width="932" height="112" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="446" font-size="12" font-weight="600" fill="#1f2937">约束与返回</text>
  <text x="40" y="468" font-size="11" fill="#475569">目标必须是 oc_…（群）或 ou_…（用户），其它字符串直接拒绝；投递目标由调用方直接给出，不再维护目标清单。</text>
  <text x="40" y="488" font-size="11" fill="#475569">文本 4000 字上限；文件 30MB 上限；图片按扩展名走图片消息，其它文件走文件消息。</text>
  <text x="40" y="508" font-size="11" fill="#475569">工具在发送完成后才返回 { targetId, sentAt }，模型据此确认送达；失败会直接抛错。</text>
  <text x="40" y="524" font-size="11" fill="#475569">投递不读写 config.json，与设置页里的机器人配置相互独立。</text>
</svg>
