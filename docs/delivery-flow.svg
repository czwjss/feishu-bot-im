<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b82"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a97a8"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2937">飞书机器人 · 投递（Delivery）流程</text>
  <text x="24" y="56" font-size="12" fill="#6b7280">配置一次 → 目标入库 → 点击测试/外部触发 → 经飞书 API 推到会话或用户</text>

  <!-- 列 1：设置页 -->
  <rect x="24" y="90" width="200" height="96" rx="10" fill="#eef4ff" stroke="#93b4ff"/>
  <text x="40" y="116" font-size="13" font-weight="600" fill="#1f2937">设置页 · 投递面板</text>
  <text x="40" y="138" font-size="11" fill="#475569">名称 / 类型 / 路由</text>
  <text x="40" y="156" font-size="11" fill="#475569">候选：已绑定会话、曾发言用户</text>
  <text x="40" y="174" font-size="11" fill="#475569">[测试] [删除] [✓ 添加]</text>

  <!-- 列 2：RPC -->
  <rect x="272" y="90" width="196" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="288" y="116" font-size="13" font-weight="600" fill="#1f2937">RPC</text>
  <text x="288" y="136" font-size="11" fill="#475569">/api/im-feishu</text>
  <text x="288" y="154" font-size="11" fill="#475569">delivery.target.list / create</text>
  <text x="288" y="170" font-size="11" fill="#475569">…remove / suggestions / test</text>

  <!-- 列 3：Runtime -->
  <rect x="516" y="90" width="208" height="96" rx="10" fill="#f5f7ff" stroke="#a5b4fc"/>
  <text x="532" y="116" font-size="13" font-weight="600" fill="#1f2937">BotRuntime（每机器人）</text>
  <text x="532" y="136" font-size="11" fill="#475569">saveDeliveryTargets()</text>
  <text x="532" y="152" font-size="11" fill="#475569">deliverySuggestions()</text>
  <text x="532" y="168" font-size="11" fill="#475569">sendToTarget(id, text)</text>

  <!-- 列 4：FeishuBot -->
  <rect x="772" y="90" width="184" height="96" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="788" y="116" font-size="13" font-weight="600" fill="#1f2937">FeishuBot</text>
  <text x="788" y="136" font-size="11" fill="#475569">sendText(chatId)</text>
  <text x="788" y="152" font-size="11" fill="#475569">sendTextToUser(openId)</text>
  <text x="788" y="168" font-size="11" fill="#475569">长连接 WSClient</text>

  <!-- 箭头：设置页 → RPC → Runtime → Bot -->
  <line x1="224" y1="138" x2="268" y2="138" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="468" y1="138" x2="512" y2="138" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="724" y1="138" x2="768" y2="138" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 存储 -->
  <rect x="516" y="230" width="208" height="88" rx="10" fill="#fffdf5" stroke="#fcd34d"/>
  <text x="532" y="254" font-size="13" font-weight="600" fill="#1f2937">存储</text>
  <text x="532" y="274" font-size="11" fill="#475569">config.json → bots[].delivery.targets</text>
  <text x="532" y="290" font-size="11" fill="#475569">state-&lt;botId&gt;.json → sessions / senders</text>
  <text x="532" y="306" font-size="11" fill="#475569">（senders 由入站消息自动记录）</text>
  <line x1="620" y1="186" x2="620" y2="226" stroke="#8a97a8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/>
  <line x1="620" y1="318" x2="620" y2="356" stroke="#8a97a8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/>

  <!-- 飞书平台 -->
  <rect x="420" y="360" width="400" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="436" y="386" font-size="13" font-weight="600" fill="#1f2937">飞书开放平台 API</text>
  <text x="436" y="408" font-size="11" fill="#475569">im.v1.message.create · receive_id_type = chat_id | open_id</text>
  <text x="436" y="426" font-size="11" fill="#475569">需要 im:message:send_as_bot</text>
  <line x1="864" y1="186" x2="864" y2="356" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="790" y="270" font-size="11" fill="#475569">HTTPS</text>

  <!-- 终点 -->
  <rect x="120" y="372" width="250" height="70" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="136" y="398" font-size="13" font-weight="600" fill="#1f2937">投递落地</text>
  <text x="136" y="418" font-size="11" fill="#475569">会话（chat_id）→ 群里所有成员</text>
  <text x="136" y="434" font-size="11" fill="#475569">用户（open_id）→ 与该用户的单聊</text>
  <line x1="416" y1="408" x2="374" y2="408" stroke="#5b6b82" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 入站反向箭头 -->
  <path d="M 96 470 L 96 200" stroke="#8a97a8" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/>
  <text x="104" y="330" font-size="11" fill="#6b7280">入站消息</text>
  <text x="104" y="346" font-size="11" fill="#6b7280">记录 chatId / sender</text>

  <!-- 当前触发方式说明 -->
  <rect x="24" y="470" width="420" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="494" font-size="12" font-weight="600" fill="#1f2937">当前触发方式</text>
  <text x="40" y="514" font-size="11" fill="#475569">设置页 [测试] → delivery.test → 发送固定测试文案</text>
  <text x="40" y="529" font-size="11" fill="#475569">同一能力已暴露给 Runtime，可被定时任务/工具复用</text>
</svg>
